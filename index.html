<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excalibur Labs: TypeScript Edition</title>
    <meta name="description" content="Learn TypeScript through game development with ExcaliburJS" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />

    <!-- App styles -->
    <link rel="stylesheet" href="src/css/tokens.css" />
    <link rel="stylesheet" href="src/css/layout.css" />
    <link rel="stylesheet" href="src/css/navigation.css" />
    <link rel="stylesheet" href="src/css/lesson.css" />
    <link rel="stylesheet" href="src/css/playground.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ── Header ── -->
      <header class="app-header">
        <button
          class="app-header__menu-btn"
          id="menu-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          ☰
        </button>

        <div class="app-header__logo">
          <span class="app-header__logo-icon">⬡</span>
          Excalibur Labs
        </div>

        <div class="app-header__spacer"></div>

        <div class="app-header__progress" id="progress-count" aria-live="polite">— / — lessons</div>
      </header>

      <div class="app-body">
        <!-- ── Sidebar ── -->
        <aside class="app-sidebar" id="sidebar" aria-label="Course navigation">
          <div class="app-sidebar__scroll">
            <track-nav></track-nav>
            <module-nav></module-nav>
          </div>
        </aside>

        <!-- Mobile overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

        <!-- ── Main content ── -->
        <main class="app-content" id="main-content" tabindex="-1">
          <lesson-view></lesson-view>
        </main>
      </div>
    </div>

    <!-- Syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- App (ES modules) -->
    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
